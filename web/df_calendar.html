<style>/* Calendar · C3 Dashboard */
/* 일정(경제지표) 공통. 숫자는 폭 고정(tabular), 색만으로 뜻을 전하지 않게 화살표·말을 함께, 차트 상자 높이 고정 */
.cal { padding-top: 22px; padding-bottom: 72px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.cal > *, .cal .col > * { min-width: 0; }
.box { padding: 22px 24px; border-radius: 18px; background: #fff; box-shadow: 0 0 0 1px var(--line); }
@media (max-width: 560px) { .box { padding: 18px 16px; border-radius: 16px; } }
.sh { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 12px; }
.sh h3, .bh { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
.fn { margin-top: 10px; font-size: 12px; line-height: 1.5; color: var(--faint); text-wrap: pretty; }
.mute2 { color: var(--faint); }
.ph h1 { font-size: clamp(26px, 3vw, 34px); font-weight: 650; letter-spacing: -0.025em; line-height: 1.15; }
.ph p { margin-top: 6px; font-size: 14px; color: var(--mute); text-wrap: pretty; }

/* 지금 경제 한눈에 */
.ovk { font-size: 13px; font-weight: 650; color: var(--primary); } .ovk span { font-weight: 500; color: var(--faint); }
.ovh { margin-top: 8px; font-size: clamp(20px, 2.2vw, 26px); font-weight: 650; letter-spacing: -0.02em; line-height: 1.25; text-wrap: balance; }

.ovl .g { font-size: 12px; font-weight: 650; color: var(--mute); padding-top: 2px; }

/* 다음 큰 발표 */
.nx .k { font-size: 12.5px; font-weight: 650; color: var(--mute); } .nx .t { margin-top: 4px; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
.nx .w { margin-top: 4px; font-size: 14px; color: var(--mute); } .nx .w b { color: var(--ink); font-weight: 650; }
.nx .f { margin-top: 8px; font-size: 13px; color: var(--mute); } .nx .f b { color: var(--ink); font-weight: 600; }

/* 일정표 */
.sch { list-style: none; padding: 0; display: grid; gap: 14px; }
.sch .dh { font-size: 12.5px; font-weight: 650; color: var(--mute); margin-bottom: 4px; } .sch .today { display: inline-flex; height: 18px; padding: 0 6px; margin-inline-start: 4px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 10.5px; align-items: center; }
.sch .dg.past .ev { opacity: .78; }
.sch ul { list-style: none; padding: 0; display: grid; gap: 2px; }
.ev { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr); grid-template-areas: "tm nm" ". vals"; gap: 2px 10px; padding: 9px 10px; border-radius: 10px; text-align: start; transition: background-color 120ms ease; }
.ev .tm { grid-area: tm; font-size: 12.5px; color: var(--mute); padding-top: 1px; } .ev .nm { grid-area: nm; font-size: 14px; font-weight: 600; line-height: 1.35; }
.ev .vals { grid-area: vals; display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12.5px; color: var(--mute); } .ev .vals .a { color: var(--ink); } .ev .vals b { font-weight: 650; }
.ev.nok { cursor: default; } .ev.on { background: #eef0ff; box-shadow: inset 0 0 0 1px #d9dcff; }
@media (hover: hover) { .ev:not(.nok):hover { background: var(--soft); } }
.imp { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; margin-inline-start: 6px; border-radius: 99px; font-size: 10.5px; font-weight: 650; vertical-align: 1px; }
.imp.high { background: #fff1e6; color: #a2410b; } .imp.medium { background: #eef1f5; color: var(--mute); }

/* 지표 카드 */

.ic { position: relative; display: grid; gap: 4px; padding: 14px 14px 12px; border-radius: 14px; background: #fff; box-shadow: 0 0 0 1px var(--line); text-align: start; transition: box-shadow 150ms ease, scale 150ms ease-out; }

.ic.on { box-shadow: 0 0 0 2px var(--primary); }
@media (hover: hover) { .ic:not(.on):hover { box-shadow: 0 0 0 1px #c9d1dc, 0 8px 22px -16px rgb(13 37 61 / .4); } }
.ic .h { display: flex; justify-content: space-between; gap: 8px; } .ic .n { font-size: 13px; font-weight: 600; line-height: 1.3; } .ic .p { flex: none; font-size: 11.5px; color: var(--faint); }
.ic .v { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; }
.ic .c { font-size: 12.5px; color: var(--ink2); } .ic .c .w { color: var(--mute); }
.ic .fc { font-size: 12px; color: var(--mute); }

/* 지표 상세 */
.dt { display: grid; gap: 22px; } .dt > * { min-width: 0; }

.dth .big { margin-top: 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; } .dth .big > .mono:first-child { font-size: clamp(30px, 4vw, 40px); font-weight: 500; letter-spacing: -0.03em; }
.dth .big .c { font-size: 15px; color: var(--ink2); }

.fanw { margin-top: 12px; }
.fl { min-height: 20px; line-height: 20px; font-size: 13px; color: var(--mute); text-wrap: pretty; } .fl b { color: var(--ink); font-weight: 650; }
.fan { display: block; width: 100%; height: 220px; margin-top: 6px; }
.lgnd { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 6px; font-size: 12px; color: var(--mute); }
.lgnd i { display: inline-block; width: 16px; height: 2px; margin-inline-end: 5px; vertical-align: middle; border-radius: 1px; }
.lgnd i.s { background: rgba(83, 58, 253, .4); } .lgnd i.m { height: 3px; background: var(--primary); } .lgnd i.b { height: 10px; background: rgba(138, 150, 170, .3); }
.tw { overflow-x: auto; margin-top: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; } thead th { font-size: 11.5px; font-weight: 650; color: var(--mute); }
td.r, th.r { text-align: end; } td.b { font-weight: 650; } tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
table.stt td b { margin-inline-end: 8px; font-weight: 650; } table.stt td span { font-size: 12px; color: var(--mute); } table.stt th[scope=row] { font-weight: 600; }
.cases { margin-top: 12px; } .cases summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--primary); }
.cases ul { list-style: none; padding: 0; margin-top: 8px; display: grid; gap: 2px; }
.cases li { display: grid; grid-template-columns: auto auto auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
.cases li .r { text-align: end; } @media (max-width: 560px) { .cases li { grid-template-columns: auto auto auto; } .cases li .mute2 { display: none; } }
.mseg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: #f1f3f7; }

.mseg button[aria-pressed='true'] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgb(13 37 61 / .12); }
.skel { height: 120px; border-radius: 14px; background: linear-gradient(90deg, #eef1f5, #f6f8fb, #eef1f5); }
@media (prefers-reduced-motion: no-preference) { .skel { background-size: 200% 100%; animation: sk 1.4s linear infinite; } @keyframes sk { to { background-position: -200% 0; } } }
.err { padding: 18px; border-radius: 14px; background: #fff; box-shadow: 0 0 0 1px var(--line); font-size: 14px; }

/* 방금 나온 지표 */
.just { display: grid; gap: 8px; } .just .k { font-size: 13px; font-weight: 650; color: var(--mute); }
.jl { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 4px; scroll-padding-inline: 4px; scroll-snap-type: x proximity; } .jl::-webkit-scrollbar { display: none; }
.jt { flex: 1 0 210px; max-width: 280px; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "n d" "v v" "w w"; gap: 2px 8px; padding: 12px 14px; border-radius: 14px; background: #fff; box-shadow: 0 0 0 1px var(--line); text-align: start; scroll-snap-align: start; transition: box-shadow 150ms ease, scale 150ms ease-out; }
.jt:active { scale: 0.98; } .jt.on { box-shadow: 0 0 0 2px var(--primary); }
.jt .n { grid-area: n; font-size: 13px; font-weight: 600; } .jt .d { grid-area: d; font-size: 11.5px; color: var(--faint); } .jt b { grid-area: v; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; } .jt .w { grid-area: w; font-size: 12.5px; color: var(--mute); }
@media (hover: hover) { .jt:not(.on):hover { box-shadow: 0 0 0 1px #c9d1dc, 0 8px 22px -16px rgb(13 37 61 / .4); } }

/* 휴대폰: 지표 카드를 2열로 짧게(작은 그래프 · 10년 막대 숨김) */
@media (max-width: 640px) {
  .ics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .ic { padding: 12px; } .ic .sp, .ic .rk, .ic .rkl { display: none; } .ic .v { font-size: 20px; } .ic .h { flex-direction: column; gap: 0; } .ic .c .w { display: block; }
}
.c3 .top { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); } @media (min-width: 1000px) { .c3 .top { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; } }
.c3 .rail { display: grid; gap: 20px; } .c3 .schw { margin-top: 10px; max-height: 300px; overflow-y: auto; overscroll-behavior: contain; }
/* PC 상세: 왼쪽 = 지난 흐름 + 최근 발표 표, 오른쪽 = 과거에 비슷했을 때(두 줄 차지) → 양쪽 높이가 비슷해진다 */
@media (min-width: 1100px) {
  .c3 #detail .dt { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; column-gap: 32px; }
  .c3 #detail .dth, .c3 #detail .ai { grid-column: 1 / -1; }
  .c3 #detail .hist { grid-column: 1; grid-row: 3; } .c3 #detail .sim { grid-column: 2; grid-row: 3 / span 2; } .c3 #detail .tbl { grid-column: 1; grid-row: 4; }
}

/* 발표 순간(방금 발표 · 곧 발표) — 왼쪽 글 · 오른쪽 그래프(넓은 화면) */
.rk { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; font-weight: 650; color: var(--primary); }
.rk .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--down); box-shadow: 0 0 0 4px rgb(223 74 58 / .15); }
@media (prefers-reduced-motion: no-preference) { .rk .dot { animation: pulse 1.6s ease-in-out infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgb(223 74 58 / 0); } } }
.rh { margin-top: 10px; font-size: clamp(22px, 2.6vw, 32px); font-weight: 650; letter-spacing: -0.025em; line-height: 1.22; text-wrap: balance; }
.rp { margin-top: 8px; font-size: 14.5px; line-height: 1.6; color: var(--ink2); }
.rel { display: grid; gap: 24px 40px; grid-template-columns: minmax(0, 1fr); } .rel > * { min-width: 0; }
@media (min-width: 1100px) { .rel { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: start; } .rel .rf { grid-column: 1 / -1; } }
.rl { display: grid; gap: 18px; align-content: start; } .rl .rh { margin-top: -10px; }
.rv { display: flex; flex-wrap: wrap; gap: 16px 40px; }
.rvi { display: grid; gap: 4px; } .rvi .n { font-size: 13px; font-weight: 600; color: var(--mute); }
.rvi > b { font-size: clamp(34px, 4vw, 46px); font-weight: 400; letter-spacing: -0.035em; line-height: 1.05; }
.rvi .w { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--mute); } .rvi .w .mono { color: var(--ink); }
.vs { font-weight: 650; } .vs.above { color: #b45309; } .vs.below { color: #1d4ed8; } .vs.inline { color: var(--ink2); }
.rs { display: grid; gap: 10px; max-width: 68ch; } .rs p { font-size: 15.5px; line-height: 1.7; color: var(--ink2); text-wrap: pretty; } .rs p:first-child { color: var(--ink); }
.nm { font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
.rn { font-size: 14px; line-height: 1.55; color: var(--ink2); } .rn b { margin-inline-end: 6px; color: var(--primary); }

.rel h3, .ins h3 { font-size: 13px; font-weight: 650; color: var(--mute); margin-bottom: 8px; } .rel h3 .mute2, .ins h3 .mute2 { font-weight: 500; margin-inline-start: 4px; }
.mxr { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; min-height: 20px; margin-bottom: 4px; font-size: 12.5px; color: var(--ink2); }
.mxr i { display: inline-block; width: 8px; height: 8px; margin-inline-end: 5px; border-radius: 2px; vertical-align: 0; } .mxr b { font-weight: 650; }
.mxc { display: block; width: 100%; height: 230px; cursor: crosshair; }
/* FOMC 확률 전 → 후(덤벨): 빈 점 = 발표 직전, 찬 점 = 1시간 뒤 */
.db { display: grid; grid-template-columns: minmax(0, 7em) minmax(0, 1fr) auto; grid-template-areas: "l t v"; align-items: center; gap: 6px 14px; padding: 10px 0; } .db + .db { border-top: 1px solid var(--line); }
@media (max-width: 560px) { .db { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "l v" "t t"; } }
.db .dl { grid-area: l; font-size: 14px; font-weight: 600; } .db .dv { grid-area: v; font-size: 13px; color: var(--mute); white-space: nowrap; } .db .dv b { color: var(--ink); font-weight: 650; }
.db .dt { grid-area: t; position: relative; height: 20px; }
.db .dt::before { content: ''; position: absolute; inset-inline: 0; top: 9px; height: 2px; border-radius: 1px; background: #e6eaf0; }
.db .dt .g50 { position: absolute; inset-inline-start: 50%; top: 4px; width: 1px; height: 12px; background: #d5dbe5; }

.db .dt .p0, .db .dt .p1 { position: absolute; top: 4px; width: 12px; height: 12px; margin-inline-start: -6px; border-radius: 50%; }
.db .dt .p0 { background: #fff; box-shadow: inset 0 0 0 2px var(--faint); } .db .dt .p1 { background: var(--ink); box-shadow: 0 0 0 2px #fff; }
.dbk { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; } .dbk i { display: inline-block; width: 10px; height: 10px; margin-inline-end: 5px; border-radius: 50%; vertical-align: -1px; }
.dbk .k0 { box-shadow: inset 0 0 0 2px var(--faint); } .dbk .k1 { background: var(--ink); }
.upd { color: #b45309; font-weight: 650; } .dnd { color: #1d4ed8; font-weight: 650; }
.rf { margin-top: 0; }
.soon .rh { margin-top: 8px; font-size: clamp(20px, 2.2vw, 26px); } .soon .rh .mute2 { font-size: 15px; font-weight: 500; margin-inline-start: 6px; }

/* 작은 글자 · 오르내림 색은 사이트 공통 값(lk.css)과 같고, 흰 바탕 · 옅은 칸 바탕 모두 명암비 4.5:1 이상 */
.cal { --faint: #5f6c83; --up: #087a55; --down: #c43a2c; }
