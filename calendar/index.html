    <header class="ih"><p class="ovk">The US economy now <span>· AI analysis, fact-checked · 1 Nov, 00:43</span></p>
      <h2 class="insh" id="insh">Rising inflation and cooling payrolls revive a rare stagflation-risk mix</h2></header>
    <div class="ig">
      <div class="it"><p>The current regime is stagflation risk: CPI inflation is <b class="nm">3.7%</b> and payroll gains averaged <b class="nm">56k</b> over the last 3 months.</p><p>This mix has been rare since 1991: 24 months fit, with Oct 2026 the most recent.</p><p>The sample is small, but over the next 12 months after similar periods, excluding recession months, CPI inflation had a median <b class="nm">−0.59%p</b> move versus <b class="nm">+0.03%p</b> in a typical month.</p><p>The closest past months ended differently: Aug 2000 led to recession, while Dec 2005 and Oct 1996 did not.</p><p>The next FOMC odds put a hike at <b class="nm">70%</b>, while after similar periods Fed funds was cut in 10 of 17.</p>
</div>
      <div class="iv"><figure class="rgm"><canvas class="rgc" id="rgc" role="img" aria-label="Regime map: Stagflation risk, last 12 months"></canvas>
    <figcaption class="mute2"><b class="rgn">Now: CPI <span class="mono">3.7%</span> (vs 3 releases ago <span class="mono">+0.25%p</span>) · payroll gains, 3-release avg <span class="mono">56k</span> (the 3 before <span class="mono">115k</span>)</b>
      Across: payroll momentum. Up: CPI momentum. Dots: last 12 months.</figcaption></figure></div>
    </div>

    <div class="pa"><h3>After the closest past months: the S&P 500 over 12 months <span class="mute2">month-end, start = 0%</span></h3>
      <canvas class="pac" id="pac" role="img" aria-label="Aug 2000 −25.3%, Dec 2005 +13.6%, Oct 1996 +29.7%"></canvas>
      <ul class="ans"><li class="an"><p class="anh"><i class="sw a0" aria-hidden="true"></i><b>Aug 2000</b><span class="mute2">Stagflation risk</span></p>
