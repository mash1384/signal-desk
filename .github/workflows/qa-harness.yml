name: QA harness (never publishes)
on:
  workflow_dispatch:
  schedule:
    - cron: "19 17 * * *"
permissions:
  contents: read
concurrency:
  group: qa-harness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.1
      # Existing findings deliberately fail. No baseline suppression.
      - run: python -m ruff check pipeline tools tests
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: node --test tests/worker/worker.test.mjs
      - run: python -m tests.run_unit --coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-${{ matrix.python }}
          path: .qa/
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m tests.mutation.run
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation
          path: .qa/mutation.json
  public-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: flash
          path: flash
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema==4.25.1
      - run: python -m tests.build_site --published site --flash flash --out dist
      - run: python -m tests.check_site --site dist --flash flash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-contracts
          path: .qa/contracts.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: flash
          path: flash
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m tests.build_site --published site --flash flash --out dist
      - run: python -m pytest tests/e2e --matrix full --site dist --flash flash --junitxml=.qa/browser.xml -q
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser
          path: .qa/
