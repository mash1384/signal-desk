name: QA harness (never publishes)
on:
  workflow_dispatch:
  push:
    branches: ["tests/**"]   # 테스트 브랜치는 main 에 합치기 전에 원격에서 전체 QA (배포 없음)
  schedule:
    - cron: "19 17 * * *"
permissions:
  contents: read
concurrency:
  group: qa-harness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.1
      # Existing findings deliberately fail. No baseline suppression.
      - run: python -m ruff check pipeline tools tests
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: node --test tests/worker/worker.test.mjs
      - run: python -m tests.run_unit --coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true   # 결과물이 .qa/(숨김 폴더)에 있다 — 기본값이면 아무것도 안 올라간다
          name: unit-${{ matrix.python }}
          path: .qa/
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m tests.mutation.run
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true   # 결과물이 .qa/(숨김 폴더)에 있다 — 기본값이면 아무것도 안 올라간다
          name: mutation
          path: .qa/mutation.json
  public-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: flash
          path: flash
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema==4.25.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: SIGNAL_PRERENDER_STRICT=1 python -m tests.build_site --published site --flash flash --out dist
      - run: python -m tests.check_site --site dist --flash flash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true   # 결과물이 .qa/(숨김 폴더)에 있다 — 기본값이면 아무것도 안 올라간다
          name: public-contracts
          path: .qa/contracts.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: flash
          path: flash
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: SIGNAL_PRERENDER_STRICT=1 python -m tests.build_site --published site --flash flash --out dist
      - run: python -m pytest tests/e2e --matrix full --site dist --flash flash --junitxml=.qa/browser.xml -q -s --a11y zero
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true   # 결과물이 .qa/(숨김 폴더)에 있다 — 기본값이면 아무것도 안 올라간다
          name: browser
          path: .qa/

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 479cc03645a444e96207818066b0da9e483732a5
          path: .qa/before-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt -r tests/perf/requirements.txt
      # gh-pages uses commit --amend + force-push. Its old SHA may disappear.
      - run: python -m tests.perf.snapshot --out .qa/snapshot-r
      - run: python -m playwright install --with-deps chromium
      - run: node --test tests/perf/candles.test.mjs
      - name: Build the unchanged source with the same fixed snapshots
        working-directory: .qa/before-source
        run: python -m tests.build_site --published ../snapshot-r/gh-pages --flash ../snapshot-r/flash --out ../perf-before/signal-desk
      - run: python -m tests.build_site --published .qa/snapshot-r/gh-pages --flash .qa/snapshot-r/flash --out .qa/perf-after/signal-desk
      # Measure serially on the same runner. Never compare Linux CPU times
      # with the operator's Mac; transfer caps remain the committed caps.
      - run: python -m tests.perf.vitals --site .qa/perf-before/signal-desk --channel chromium --output .qa/ci-before.json
      - run: python -m tests.perf.vitals --site .qa/perf-after/signal-desk --channel chromium --output .qa/ci-after.json
      - run: python -m tests.perf.budgets --before .qa/ci-before.json --after .qa/ci-after.json
      - run: python -m tests.perf.browser --site .qa/perf-after/signal-desk --channel chromium
      - run: python -m tests.perf.visuals --site .qa/perf-after/signal-desk --channel chromium --forbid-raw --out .qa/perf-captures
      - run: python -m tests.perf.fonts .qa/perf-captures/capture.json
      - run: python -m tests.perf.incremental --work .qa/perf-incremental
      - run: python -m tests.perf.components --site .qa/perf-after/signal-desk --old-site .qa/perf-before/signal-desk --old-site .qa/perf-incremental/before/signal-desk --channel chromium
      - run: python -m tests.perf.candle_visuals --before .qa/perf-before/signal-desk --after .qa/perf-after/signal-desk --channel chromium --out .qa/perf-candles
      - run: python -m tests.perf.negative --site .qa/perf-after/signal-desk --before .qa/ci-before.json --after .qa/ci-after.json --capture .qa/perf-captures/capture.json --channel chromium --work .qa/perf-negative
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true   # 결과물이 .qa/(숨김 폴더)에 있다 — 기본값이면 아무것도 안 올라간다
          name: performance
          path: |
            .qa/*perf*.json
            .qa/ci-*.json
            .qa/perf-captures/
            .qa/perf-candles/
            .qa/perf-negative/result.json
            .qa/perf-negative/*.log
            .qa/perf-incremental/result.json
