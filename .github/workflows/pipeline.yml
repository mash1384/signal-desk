# 15분마다 뉴스 수집 → 임팩트 측정 → 정적 사이트 빌드 → gh-pages 배포
name: pipeline

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "web/**", "tests/**", ".github/workflows/pipeline.yml"]

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout published site (state lives in gh-pages data/)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Install optional packages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m pip install --quiet playwright
          if [ -n "$ANTHROPIC_API_KEY" ]; then python -m pip install --quiet anthropic; fi

      - name: Korean fonts for share cards
        continue-on-error: true
        run: |
          if ! fc-list :lang=ko | grep -q .; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fi

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_URL: ${{ vars.TELEGRAM_CHANNEL_URL }}
          SIGNAL_LLM_MODEL: ${{ vars.SIGNAL_LLM_MODEL }}
          SIGNAL_SITE_URL: ${{ vars.SIGNAL_SITE_URL }}
          SIGNAL_SITE_BASE: ${{ vars.SIGNAL_SITE_BASE }}
        run: python -m pipeline.run --prev site --out dist

      - name: Publish to gh-pages
        run: |
          rsync -a --delete --exclude .git dist/ site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          # 이력을 쌓지 않도록 한 커밋을 계속 고쳐 쓴다 (바뀐 파일만 올라간다)
          git commit --amend -q -m "deploy: site snapshot"
          git push -f origin HEAD:gh-pages
