# 15분마다 뉴스 수집 → 임팩트 측정 → 정적 사이트 빌드 → gh-pages 배포
# 정시 실행은 Cloudflare 스케줄러(worker/)가 workflow_dispatch로 건다. 아래 schedule은 그게 멈췄을 때의 예비다
name: pipeline

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "web/**", "tests/**", ".github/workflows/pipeline.yml"]

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  SIGNAL_POLICY_NAMES: ${{ secrets.SIGNAL_POLICY_NAMES }}   # 사이트 출처 검사가 막을 이름(비공개 목록)
jobs:
  run:
    if: github.repository == 'mash1384/signal-desk'   # 비공개 저장소(signal-ops)에서는 돌지 않는다
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout published site (state lives in gh-pages data/)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      # 운영자 Mac의 로컬 AI 판정(tools/judge_live.py가 llm 브랜치에 올림). 없으면 키워드 규칙으로 돈다
      - name: Checkout local AI judgments (optional)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: llm
          path: llm
          fetch-depth: 1

      # flash는 빌드·계약 검사의 필수 입력. 첫 checkout 실패만 한 번 재시도한다
      - name: Checkout required flash data
        id: flash_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: flash
          path: flash
          fetch-depth: 1

      - name: Retry required flash checkout
        if: steps.flash_checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: flash
          path: flash
          fetch-depth: 1

      - name: Verify required flash files
        run: |
          for file in flash/flash.json flash/daily/econ.json; do
            if [ ! -f "$file" ]; then
              echo "::error::Required flash input is missing: $file"
              exit 1
            fi
          done

      # Shared browser markup is rendered locally with read-only Node permissions.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-gate.txt

      - name: Install test tools
        run: python -m pip install --quiet -r tests/requirements-gate.txt

      - name: Ruff (existing findings must be resolved before deployment)
        run: python -m ruff check $(ls -d pipeline tools tests 2>/dev/null)   # 규칙은 ruff.toml

      - name: Unit tests
        run: python -m tests.run_unit

      - name: Install optional packages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then python -m pip install --quiet anthropic; fi

      - name: Korean fonts for share cards
        continue-on-error: true
        run: |
          if ! fc-list :lang=ko | grep -q .; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fi

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_URL: ${{ vars.TELEGRAM_CHANNEL_URL }}
          SIGNAL_LLM_MODEL: ${{ vars.SIGNAL_LLM_MODEL }}
          SIGNAL_SITE_URL: ${{ vars.SIGNAL_SITE_URL }}
          SIGNAL_SITE_BASE: ${{ vars.SIGNAL_SITE_BASE }}
          SIGNAL_UPBIT_PROXY: ${{ vars.SIGNAL_UPBIT_PROXY }}
        run: python -m pipeline.run --prev site --out dist

      # pip·OS 의존성·브라우저 준비는 아래 gate 180초 제한 밖이다. 추가 시간 전체 3분은 원격 실측이 필요하다
      # 브라우저 캐시와 필요한 headless shell만 사용해 cold 다운로드를 줄인다
      - name: Cache QA browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('tests/requirements-gate.txt') }}

      - name: Install QA browser
        run: python -m playwright install --with-deps --only-shell chromium

      # Local build gate: no credentials are passed to the browser/tests.
      # The complete 48-case matrix and BDD live in qa-harness.yml.
      - name: Validate public artifacts and browser smoke
        timeout-minutes: 3
        run: python -m tests.gate --site dist --flash flash --seconds 150

      - name: Publish to gh-pages
        run: |
          # 빌드에 없는 것은 모두 지운다(예전 디자인 시안 /preview/ 포함 — 비공개 저장소의 gh-pages 백업에 보관)
          rsync -a --delete --exclude .git dist/ site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          # 이력을 쌓지 않도록 한 커밋을 계속 고쳐 쓴다 (바뀐 파일만 올라간다)
          git commit --amend -q -m "deploy: site snapshot"
          git push -f origin HEAD:gh-pages
