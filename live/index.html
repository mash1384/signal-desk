'Noto Sans KR':['Noto Sans KR Regular','NotoSansKR-Regular','Noto Sans KR'],'Noto Sans CJK KR':['Noto Sans CJK KR Regular','NotoSansCJKkr-Regular','Noto Sans CJK KR'],
