<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delfona · 심볼 후보 M1~M5</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --ink: #0d253d; --mute: #5b6b82; --faint: #8a96aa; --line: #e3e8ee; }
* { box-sizing: border-box; margin: 0; }
body { background: #000; color: #fff; font-family: "Pretendard Variable", Pretendard, Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.hero { padding: 72px 24px 56px; text-align: center; }
.hero h1 { font-size: clamp(26px, 3.4vw, 40px); font-weight: 600; letter-spacing: -0.03em; }
.hero p { margin-top: 10px; color: #8f9bb0; font-size: 15px; }
.row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: clamp(28px, 5vw, 64px); padding: 32px 24px 72px; }
.row svg { width: clamp(64px, 9vw, 112px); height: clamp(64px, 9vw, 112px); color: #fff; }
.c { display: grid; gap: 0; max-width: 1180px; margin: 0 auto 24px; border-radius: 28px; overflow: hidden; background: #0b0b0c; box-shadow: 0 0 0 1px #1e1f22; }
@media (min-width: 900px) { .c { grid-template-columns: 1.15fr 1fr; } }
.c .dark { display: grid; place-items: center; min-height: 380px; background: #000; }
.c .dark svg.big { width: 200px; height: 200px; color: #fff; }
.c .info { padding: 32px 32px 30px; background: #fff; color: var(--ink); display: grid; gap: 18px; align-content: start; }
.c .k { font-family: "JetBrains Mono", monospace; font-size: 12px; color: #533afd; letter-spacing: .06em; }
.c h2 { font-size: 26px; font-weight: 650; letter-spacing: -0.03em; }
.c .why { font-size: 15px; line-height: 1.6; color: #273951; }
.lock { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
.lock svg { width: 40px; height: 40px; color: var(--ink); flex: none; }
.lock .wm { font-family: Michroma, Inter, sans-serif; font-size: 20px; letter-spacing: .32em; color: var(--ink); }
.lock.dk { padding: 16px 18px; border: 0; border-radius: 14px; background: #000; } .lock.dk svg, .lock.dk .wm { color: #fff; }
.sizes { display: flex; align-items: flex-end; gap: 18px; padding-top: 4px; }
.sizes div { display: grid; justify-items: center; gap: 6px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--faint); }
.sizes svg { color: var(--ink); }
.app { width: 56px; height: 56px; border-radius: 14px; background: #000; display: grid; place-items: center; } .app svg { width: 34px; height: 34px; color: #fff; }
.app.l { background: #fff; box-shadow: 0 0 0 1px var(--line); } .app.l svg { color: #000; }
.foot { padding: 20px 24px 60px; text-align: center; color: #6b7487; font-size: 13px; }
@media (prefers-reduced-motion: no-preference) {
  .dark svg.big .draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.6s cubic-bezier(.23,1,.32,1) .2s forwards; }
  .dark svg.big .fadein { opacity: 0; animation: fade .6s ease 1.1s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } } @keyframes fade { to { opacity: 1; } }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- M1 · Orbit D: 얇은 선으로 그린 D와 그 둘레를 도는 궤도, 궤도 위 신호 점 -->
  <symbol id="m1" viewBox="0 0 100 100">
    <path class="draw" d="M33 20 V80 M33 20 H47 A30 30 0 0 1 47 80 H33" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
    <ellipse class="draw" cx="50" cy="50" rx="45" ry="15" transform="rotate(-24 50 50)" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <circle class="fadein" cx="91.1" cy="31.7" r="4.2" fill="currentColor"/>
  </symbol>
  <!-- M2 · Delta Arc: 변화(Δ)의 날카로운 삼각형, 오른쪽 다리가 위로 휘어 오르는 신호의 궤적이 된다 -->
  <symbol id="m2" viewBox="0 0 106 100">
    <defs><mask id="m2k" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M-4 86 Q46 70 104 6" fill="none" stroke="#000" stroke-width="7"/></mask></defs>
    <path d="M47 13 L88 85 L6 85 Z" fill="currentColor" mask="url(#m2k)"/>
    <path d="M67.21 47.10 L68.13 46.22 L69.05 45.33 L69.97 44.43 L70.88 43.53 L71.80 42.61 L72.72 41.70 L73.64 40.77 L74.56 39.84 L75.48 38.90 L76.41 37.95 L77.33 37.00 L78.25 36.03 L79.17 35.07 L80.09 34.09 L81.02 33.11 L81.94 32.12 L82.86 31.12 L83.79 30.12 L84.71 29.10 L85.64 28.08 L86.56 27.06 L87.49 26.02 L88.41 24.98 L89.34 23.93 L90.26 22.88 L91.19 21.81 L92.11 20.74 L93.04 19.66 L93.96 18.58 L94.89 17.48 L95.81 16.38 L96.74 15.27 L97.66 14.15 L98.58 13.02 L99.50 11.88 L100.41 10.74 L101.33 9.58 L102.24 8.41 L103.14 7.22 L104.00 6.00 L104.00 6.00 L102.86 6.98 L101.77 7.98 L100.68 8.98 L99.60 9.98 L98.53 10.98 L97.46 11.97 L96.39 12.96 L95.33 13.94 L94.28 14.92 L93.22 15.88 L92.17 16.85 L91.12 17.80 L90.07 18.75 L89.03 19.70 L87.99 20.64 L86.95 21.57 L85.91 22.49 L84.88 23.41 L83.85 24.32 L82.82 25.22 L81.79 26.11 L80.77 27.00 L79.74 27.89 L78.72 28.76 L77.70 29.63 L76.68 30.49 L75.67 31.34 L74.66 32.19 L73.64 33.03 L72.64 33.86 L71.63 34.69 L70.62 35.51 L69.62 36.32 L68.62 37.12 L67.62 37.92 L66.62 38.71 L65.63 39.49 L64.63 40.26 L63.64 41.03 L62.65 41.79 Z" fill="currentColor"/>
  </symbol>
  <!-- M3 · Pulse D: D의 가운데를 가로지르는 한 번의 맥박(신호) -->
  <symbol id="m3" viewBox="0 0 100 100">
    <path class="draw" d="M24 22 H50 A28 28 0 0 1 50 78 H24 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="miter"/>
    <path class="draw" d="M14 50 H38 L45 34 L55 66 L62 50 H86" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="miter" stroke-linecap="square"/>
  </symbol>
  <!-- M4 · Split Disc: 하나의 원(소식)이 사선으로 갈라져 위(호재)·아래(악재)로 어긋난다 -->
  <symbol id="m4" viewBox="0 0 100 100">
    <defs><clipPath id="m4u"><polygon points="0,0 100,0 100,26 0,74"/></clipPath><clipPath id="m4d"><polygon points="0,82 100,34 100,100 0,100"/></clipPath></defs>
    <circle cx="51.5" cy="47" r="36" fill="currentColor" clip-path="url(#m4u)"/>
    <circle cx="48.5" cy="53" r="36" fill="currentColor" clip-path="url(#m4d)"/>
  </symbol>
  <!-- M5 · Split D: 줄기와 둥근 몸통이 떨어진 D. 몸통 위쪽이 비스듬히 잘려 앞으로 나아가는 속도감 -->
  <symbol id="m5" viewBox="0 0 100 100">
    <path d="M16 20 H32 V80 H16 Z" fill="currentColor"/>
    <path d="M50 20 H56 A30 30 0 0 1 56 80 H38 V66 H56 A16 16 0 0 0 56 34 H38 Z" fill="currentColor"/>
  </symbol>
</svg>

<section class="hero"><h1>Delfona 심볼 후보 M1~M5</h1><p>보내 주신 레퍼런스처럼 단색 · 기하 · 한 덩어리 기호. 어느 회사 로고도 따라 하지 않고, Delfona(D · Δ 변화 · 신호)에서만 만들었어요.</p></section>
<div class="row" aria-label="모두 나란히"><svg><use href="#m1"/></svg><svg><use href="#m2"/></svg><svg><use href="#m3"/></svg><svg><use href="#m4"/></svg><svg><use href="#m5"/></svg></div>

<template id="card"><article class="c"><div class="dark"><svg class="big"><use/></svg></div><div class="info"><p class="k"></p><h2></h2><p class="why"></p>
  <div class="lock"><svg><use/></svg><span class="wm">DELFONA</span></div><div class="lock dk"><svg><use/></svg><span class="wm">DELFONA</span></div>
  <div class="sizes"><div><div class="app"><svg><use/></svg></div>앱</div><div><div class="app l"><svg><use/></svg></div>앱(밝게)</div><div><svg width="32" height="32"><use/></svg>32px</div><div><svg width="16" height="16"><use/></svg>16px</div></div></div></article></template>
<main id="cards"></main>
<p class="foot">글자는 Michroma(넓은 기하 서체)로 임시 조판. 확정하면 심볼·글자 모두 벡터로 다듬어 파비콘·앱 아이콘·OG 이미지까지 만들어요.</p>
<script>
const C = [
  ['m1', 'M1 · ORBIT D', '궤도 D', '얇은 선으로 그린 D 둘레를 기울어진 궤도가 돌고, 궤도 끝에 신호 점 하나. 전 세계 소식을 돌며 지켜본다는 뜻. 레퍼런스의 얇은 선 계열.'],
  ['m2', 'M2 · DELTA ARC', '델타 아크', '변화를 뜻하는 Δ를 신호의 궤적 하나가 비스듬히 가르고, 그 궤적이 삼각형 밖으로 날카롭게 뻗어 올라가요. 속도감 있는 칼날 곡선 계열.'],
  ['m3', 'M3 · PULSE D', '펄스 D', 'D의 한가운데를 맥박 한 번이 가로질러요. 소음 속에서 튀는 신호 하나. 굵은 단선 계열이라 작게 써도 또렷해요.'],
  ['m4', 'M4 · SPLIT DISC', '갈라진 원', '소식 하나(원)가 사선으로 갈라져 위(호재)·아래(악재)로 살짝 어긋나요. 우리가 하는 일, 판정을 한 기호로. 가장 단순한 면 계열.'],
  ['m5', 'M5 · SPLIT D', '스플릿 D', '줄기와 몸통이 떨어진 굵은 D. 몸통 위쪽을 비스듬히 잘라 앞으로 나아가는 느낌. 글자형 엠블럼 계열이라 브랜드 이름과 바로 이어져요.'],
];
const t = document.getElementById('card'), box = document.getElementById('cards');
C.forEach(([id, k, n, why]) => { const c = t.content.cloneNode(true); c.querySelectorAll('use').forEach((u) => u.setAttribute('href', '#' + id));
  c.querySelector('.k').textContent = k; c.querySelector('h2').textContent = n; c.querySelector('.why').textContent = why; box.appendChild(c); });
</script>
</body>
</html>
